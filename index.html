<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주크박스">
<meta name="theme-color" content="#d43f2c">
<title>내 플레이리스트 주크박스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2326222b'/%3E%3Ccircle cx='50' cy='50' r='17' fill='%23d43f2c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column — a big "spin" deck on top, the saved crate of playlists below */
:root{
  --bg:#f3f1f4; --panel:#ffffff; --ink:#1d1a22; --muted:#6b6573; --line:#dcd7e0;
  --accent:#d43f2c; --accent-ink:#ffffff; --disc:#26222b; --groove:#3a3540;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141217; --panel:#1e1b22; --ink:#efebf2; --muted:#a39dab; --line:#34303a;
  --accent:#ef5a45; --accent-ink:#ffffff; --disc:#0b0a0d; --groove:#2a2630; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.deck{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
@media (max-width:480px){.deck{grid-template-columns:1fr;justify-items:center;text-align:center}}
/* Outer .disc turns forever like a record on a platter; inner .vinyl adds a fast burst on "랜덤 선택". The sheen stays still, as light would. */
.disc{position:relative;width:120px;height:120px;flex:none;animation:turn 3.6s linear infinite}
.vinyl{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:repeating-radial-gradient(circle,var(--disc) 0 3px,var(--groove) 3px 4px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.vinyl::after{content:"";width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 4px var(--disc);
  background:radial-gradient(circle at 50% 50%,var(--disc) 0 3px,transparent 3.5px),
             radial-gradient(circle at 50% 20%,rgba(255,255,255,.85) 0 2.5px,transparent 3px),
             var(--accent)}
.vinyl.spin{animation:burst 1.1s cubic-bezier(.2,.7,.3,1)}
.disc-wrap{position:relative;flex:none}
.disc-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.14) 14%,transparent 20% 60%,rgba(255,255,255,.1) 64%,transparent 70%)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes burst{to{transform:rotate(1080deg)}}
@media (prefers-reduced-motion:reduce){.disc,.vinyl.spin{animation:none}}
.now{min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
.now-title{font-family:var(--f-display);font-size:24px;line-height:1.2;margin:0;overflow-wrap:anywhere}
.now-title.empty{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:480px){.row.center{justify-content:center}}
button,.btn{font:inherit;font-weight:600;border-radius:999px;padding:12px 20px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{border-color:var(--muted)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary:hover{filter:brightness(1.07);border-color:var(--accent)}
@media (max-width:480px){.deck .row .btn,.deck .row button{flex:1 1 100%}}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:0}

form{display:flex;flex-direction:column;gap:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;width:100%}
textarea{font-family:var(--f-mono);font-size:13px;min-height:90px;resize:vertical}
.msg{font-size:13px;margin:0;min-height:1em}
.msg.err{color:var(--accent)}
.msg.ok{color:var(--muted)}

.crate-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pl{min-width:0}
.pl a{color:var(--ink);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.pl a:hover{color:var(--accent)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--accent);letter-spacing:1px}
.actions{display:flex;gap:6px}
.actions button{padding:6px 12px;font-size:13px;min-height:36px}
.confirm{color:var(--accent)}
li.empty-crate{display:block;padding:20px 0;color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);min-height:40px;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
summary:hover{border-color:var(--muted)}
details[open] summary{margin-bottom:12px;border-color:var(--accent);color:var(--accent)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.backup{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>내 플레이리스트 주크박스</h1>
    <p class="sub">자주 듣는 유튜브 플레이리스트를 모아두고, 버튼 한 번에 랜덤으로 골라 틀어요.</p>
  </header>

  <section class="deck" aria-live="polite">
    <div class="disc-wrap" aria-hidden="true"><div class="disc"><div class="vinyl" id="disc"></div></div></div>
    <div class="now">
      <span class="label">지금 틀 플레이리스트</span>
      <p class="now-title empty" id="nowTitle">아직 고르지 않았어요</p>
      <div class="row center">
        <button class="primary" id="spinBtn" type="button">랜덤 선택</button>
        <a class="btn" id="playLink" href="#" target="_blank" rel="noopener" hidden>유튜브에서 재생 ↗</a>
      </div>
      <p class="hint">유튜브가 열리면 플레이리스트의 셔플 버튼을 누르면 곡 순서까지 랜덤이에요.</p>
    </div>
  </section>

  <section>
    <form id="addForm" novalidate>
      <span class="label">플레이리스트 추가</span>
      <input id="urlIn" type="url" inputmode="url" placeholder="유튜브 플레이리스트 링크 붙여넣기" autocomplete="off">
      <div class="fields">
        <input id="titleIn" type="text" placeholder="이름 (예: 새벽 작업용 로파이)" autocomplete="off">
        <select id="weightIn" aria-label="얼마나 자주 듣나요">
          <option value="3">★★★ 제일 자주 들음</option>
          <option value="2" selected>★★ 자주 들음</option>
          <option value="1">★ 가끔 들음</option>
        </select>
      </div>
      <div class="row"><button type="submit" id="addBtn">저장</button></div>
      <p class="msg err" id="err"></p>
    </form>
  </section>

  <section>
    <div class="crate-head">
      <span class="label">저장된 플레이리스트</span>
      <span class="meta" id="count"></span>
    </div>
    <ul id="list"></ul>
  </section>

  <details>
    <summary><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.5-9.97A6 6 0 0 1 18 7a4.5 4.5 0 0 1 0 9"/><path d="M12 12v8M9 15l3-3 3 3"/></svg>백업</summary>
    <div class="backup">
      <p class="hint">목록은 이 브라우저에만 저장돼요. 다른 기기로 옮기려면 백업 코드를 복사해서, 그 기기에서 이 페이지를 열고 아래 칸에 붙여넣은 뒤 불러오기를 누르세요.</p>
      <div class="row">
        <button type="button" id="copyBtn">백업 코드 복사</button>
      </div>
      <textarea id="backupIn" placeholder="백업 코드를 여기에 붙여넣기"></textarea>
      <div class="row">
        <button type="button" id="importBtn">불러오기 (기존 목록에 합치기)</button>
      </div>
      <p class="msg ok" id="backupMsg"></p>
    </div>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'jukebox.v1';
let items = [];          // {id,title,url,listId,videoId,weight,plays,addedAt}
let pendingDelete = null, lastPick = null;

function load(){ try{ items = JSON.parse(localStorage.getItem(KEY) || '[]'); if(!Array.isArray(items)) items = []; }catch{ items = []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); return true; }catch{ return false; } }

function parseYouTube(raw){
  let u; try{ u = new URL(raw.trim()); }catch{ return null; }
  if(!/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(u.hostname)) return null;
  const listId = u.searchParams.get('list');
  let videoId = u.searchParams.get('v');
  if(u.hostname.endsWith('youtu.be')) videoId = u.pathname.slice(1) || null;
  if(!listId && !videoId) return null;
  const clean = listId ? 'https://www.youtube.com/playlist?list=' + encodeURIComponent(listId)
                       : 'https://www.youtube.com/watch?v=' + encodeURIComponent(videoId);
  return {listId, videoId, url: clean};
}
// watch?list= starts playback right away (and opens the YouTube app on phones).
function playUrl(it){
  if(it.listId) return 'https://www.youtube.com/watch?list=' + encodeURIComponent(it.listId) + (it.videoId ? '&v=' + encodeURIComponent(it.videoId) : '');
  return it.url;
}

function render(){
  const ul = $('list'); ul.textContent = '';
  $('count').textContent = items.length ? items.length + '개' : '';
  if(!items.length){
    const p = document.createElement('li'); p.className = 'empty-crate';
    p.textContent = '아직 비어 있어요. 위에 유튜브 플레이리스트 링크를 붙여넣고 저장하면 여기에 쌓여요.';
    ul.append(p);
  }
  const sorted = [...items].sort((a,b) => (b.weight-a.weight) || ((b.plays||0)-(a.plays||0)));
  for(const it of sorted){
    const li = document.createElement('li');
    const pl = document.createElement('div'); pl.className = 'pl';
    const a = document.createElement('a'); a.href = playUrl(it); a.target = '_blank'; a.rel = 'noopener';
    a.textContent = it.title; a.addEventListener('click', () => bumpPlays(it.id));
    const meta = document.createElement('div'); meta.className = 'meta';
    const st = document.createElement('span'); st.className = 'stars'; st.textContent = '★'.repeat(it.weight);
    meta.append(st, document.createTextNode('  재생 ' + (it.plays||0) + '회'));
    pl.append(a, meta);
    const act = document.createElement('div'); act.className = 'actions';
    const del = document.createElement('button'); del.type = 'button';
    if(pendingDelete === it.id){
      del.textContent = '정말 삭제'; del.className = 'confirm';
      const cancel = document.createElement('button'); cancel.type = 'button'; cancel.textContent = '취소';
      cancel.onclick = () => { pendingDelete = null; render(); };
      del.onclick = () => removeItem(it.id);
      act.append(cancel, del);
    }else{
      del.textContent = '삭제'; del.onclick = () => { pendingDelete = it.id; render(); };
      act.append(del);
    }
    li.append(pl, act); ul.append(li);
  }
  $('spinBtn').disabled = !items.length;
}

function pick(){
  if(!items.length) return null;
  const pool = items.length > 1 && lastPick ? items.filter(i => i.id !== lastPick) : items;
  const total = pool.reduce((s,i) => s + i.weight, 0);
  let r = Math.random() * total;
  for(const it of pool){ r -= it.weight; if(r < 0) return it; }
  return pool[pool.length-1];
}

$('spinBtn').onclick = () => {
  const it = pick(); if(!it) return;
  lastPick = it.id;
  const disc = $('disc'); disc.classList.remove('spin'); void disc.offsetWidth; disc.classList.add('spin');
  $('nowTitle').textContent = it.title; $('nowTitle').classList.remove('empty');
  const link = $('playLink'); link.href = playUrl(it); link.hidden = false;
  link.onclick = () => bumpPlays(it.id);
};

function bumpPlays(id){
  const it = items.find(i => i.id === id); if(!it) return;
  it.plays = (it.plays||0) + 1; save(); render();
}

$('addForm').addEventListener('submit', e => {
  e.preventDefault(); $('err').textContent = '';
  const parsed = parseYouTube($('urlIn').value);
  if(!parsed){ $('err').textContent = '유튜브 링크를 인식하지 못했어요. 유튜브 앱에서 공유 → 링크 복사로 가져온 주소를 붙여넣어 주세요.'; return; }
  if(items.some(i => i.url === parsed.url)){ $('err').textContent = '이미 저장된 플레이리스트예요.'; return; }
  const title = $('titleIn').value.trim() || (parsed.listId ? '플레이리스트 ' + parsed.listId.slice(-6) : '영상 ' + parsed.videoId);
  items.push({id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), title, ...parsed,
    weight: Number($('weightIn').value), plays: 0, addedAt: Date.now()});
  if(!save()) $('err').textContent = '이 브라우저에서는 저장이 막혀 있어요 (시크릿 모드인지 확인해 주세요).';
  $('urlIn').value = ''; $('titleIn').value = '';
  render();
});

function removeItem(id){
  pendingDelete = null;
  items = items.filter(i => i.id !== id); save(); render();
}

// Backup: base64 of the JSON list, so it survives chat apps and memo apps intact.
function encode(list){ return 'JBX1:' + btoa(unescape(encodeURIComponent(JSON.stringify(list)))); }
function decode(code){
  const s = code.trim().replace(/^JBX1:/, '');
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
$('copyBtn').onclick = async () => {
  const code = encode(items);
  try{ await navigator.clipboard.writeText(code); $('backupMsg').textContent = '백업 코드를 복사했어요. 메모앱이나 카톡 나와의 채팅에 붙여넣어 두세요.'; }
  catch{ $('backupIn').value = code; $('backupIn').select(); $('backupMsg').textContent = '자동 복사가 안 돼서 아래 칸에 코드를 넣어뒀어요. 길게 눌러 복사하세요.'; }
};
$('importBtn').onclick = () => {
  let list;
  try{ list = decode($('backupIn').value); if(!Array.isArray(list)) throw 0; }
  catch{ $('backupMsg').textContent = '백업 코드를 읽지 못했어요. JBX1: 로 시작하는 코드 전체를 붙여넣었는지 확인해 주세요.'; return; }
  let added = 0;
  for(const it of list){
    if(!it || !it.url || items.some(i => i.url === it.url)) continue;
    items.push({id: it.id || ('p' + Math.random().toString(36).slice(2)), title: String(it.title||'플레이리스트'),
      url: it.url, listId: it.listId||null, videoId: it.videoId||null,
      weight: [1,2,3].includes(it.weight) ? it.weight : 2, plays: it.plays||0, addedAt: it.addedAt||Date.now()});
    added++;
  }
  save(); render(); $('backupIn').value = '';
  $('backupMsg').textContent = added ? added + '개를 불러왔어요.' : '새로 추가할 플레이리스트가 없었어요 (이미 모두 있어요).';
};

load(); render();
</script>
</body>
</html>
